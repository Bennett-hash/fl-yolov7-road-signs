[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fedyolo"
dynamic = ["version"]
description = "The experiments of Bi (2024), federated averaging of YOLOv7-tiny on GTSRB road signs, with the averaging and the dataset corrected"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Yizhen Bi" }]
requires-python = ">=3.10"
# What importing this package needs; YOLOv7 is not a package and needs packages of its own (see README).
dependencies = ["torch>=1.13", "numpy"]

[project.optional-dependencies]
# OpenCV for fedyolo.data, which writes the dataset's PNG images.
data = ["opencv-python-headless"]
figures = ["matplotlib"]
dev = ["pytest>=8", "ruff==0.17.6"]

[project.urls]
Paper = "https://doi.org/10.54254/2755-2721/49/20241067"
Repository = "https://github.com/Bennett-hash/fl-yolov7-road-signs"

[tool.setuptools.dynamic]
version = { attr = "fedyolo.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fedyolo = ["gtsrb_2023.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"
# The 2023 function is kept exactly as it was written.
extend-exclude = ["src/fedyolo/original.py", "original", "third_party"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
